opt_in_rules:
  - all
disabled_rules:
  - anonymous_argument_in_multiline_closure
  - contrasted_opening_brace
  - direct_return
  - discouraged_optional_collection
  - explicit_acl
  - explicit_enum_raw_value
  - explicit_top_level_acl
  - explicit_type_interface
  - file_name
  - file_types_order
  - inclusive_language
  - let_var_whitespace
  - missing_docs
  - multiline_function_chains
  - no_extension_access_modifier
  - no_grouping_extension
  - no_magic_numbers
  - one_declaration_per_file
  - prefer_key_path
  - prefixed_toplevel_constant
  - prohibited_interface_builder
  - redundant_self_in_closure
  - required_deinit
  - sorted_enum_cases
  - strong_iboutlet
  - superfluous_else
  - switch_case_on_newline
  - type_body_length
  - unused_parameter
  - vertical_whitespace_between_cases
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
analyzer_rules:
  - capture_variable
  # explicit_self
  - typesafe_array_init
  - unused_declaration
  - unused_import

cyclomatic_complexity:
  error: 10
  ignores_case_statements: true
file_header:
  required_pattern: |
    \/\/
    \/\/ SWIFTLINT_CURRENT_FILENAME
    \/\/
    \/\/ Copyright \U000000A9 \d{4} [^\n]+\. All rights reserved\.
    \/\/
file_length: 300
function_body_length: 50
function_parameter_count: 5
generic_type_name:
  min_length: 0
  max_length: 20
identifier_name:
  min_length: 0
  max_length: 40
large_tuple: 10
line_length:
  error: 120
  ignores_comments: true
nesting:
  ignore_typealiases_and_associatedtypes: true
number_separator:
  minimum_length: 5
trailing_comma:
  mandatory_comma: true
type_name:
  min_length: 0
  max_length: 50
deployment_target:
  iOS_deployment_target: 17.0
  watchOS_deployment_target: 10.0
modifier_order:
  preferred_modifier_order: [acl, final, override] # decide order for the following items: setterACL, dynamic, mutators, lazy, required, convenience, typeMethods, owned
type_contents_order:
  order:
    - associated_type
    - type_alias
    - subtype
    - type_property
    - type_method
    - case
    - instance_property
    - ib_inspectable
    - ib_outlet
    - subscript
    - deinitializer
    - initializer
    - view_life_cycle_method
    - other_method
    - ib_action
self_binding:
  bind_identifier: this
attributes:
  always_on_line_above: ["@TestAttribute"]
shorthand_argument:
  allow_until_line_after_opening_brace: 5
